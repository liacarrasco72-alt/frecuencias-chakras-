<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energía Vital - Frecuencias del Alma</title>
<style>
body{font-family:-apple-system,system-ui,sans-serif;background:#0a0a14;color:#fff;margin:0;padding:20px}
h1{text-align:center;color:#c084fc;margin:30px 0 10px}
p.sub{text-align:center;opacity:.6;margin-bottom:30px}
.container{max-width:600px;margin:0 auto}
.track{background:rgba(255,255,255,.07);border:1px solid rgba(192,132,252,.2);border-radius:16px;padding:16px;margin:12px 0;display:flex;align-items:center;gap:12px;transition:.2s}
.track.playing{border-color:#c084fc;background:rgba(192,132,252,.15);transform:scale(1.01)}
.track button{background:#c084fc;border:none;border-radius:50%;width:48px;height:48px;font-size:20px;cursor:pointer;flex-shrink:0}
.track-info{flex:1;min-width:0}
.track-title{font-weight:600;font-size:16px}
audio{width:100%;margin-top:10px;height:32px}
</style>
</head>
<body>
<h1>✨ Energía Vital ✨</h1>
<p class="sub">Frecuencias para el alma - 11 temas originales</p>
<div class="container" id="playlist"></div>
<script>
const songs=[
{title:"Amanecer",file:"amanecer.mp3"},
{title:"Armonía",file:"armonia.mp3"},
{title:"Aura",file:"aura.mp3"},
{title:"Ávalon",file:"avalon.mp3"},
{title:"Energía",file:"energia.mp3"},
{title:"Eres Especial",file:"eres-especial.mp3"},
{title:"Esperanza",file:"esperanza.mp3"},
{title:"Eternidad",file:"eternidad.mp3"},
{title:"Galaxia",file:"galaxia.mp3"},
{title:"Ítaca",file:"itaca.mp3"},
{title:"Sora",file:"sora.mp3"}
];
const container=document.getElementById('playlist');
let currentAudio=null;
songs.forEach((s,i)=>{
const div=document.createElement('div');
div.className='track';
div.innerHTML=`<button id="b${i}">▶</button><div class="track-info"><div class="track-title">${i+1}. ${s.title}</div><audio id="a${i}" controls preload="none" src="${s.file}"></audio></div>`;
container.appendChild(div);
const btn=div.querySelector(`#b${i}`);
const audio=div.querySelector(`#a${i}`);
btn.onclick=()=>{
if(currentAudio&&currentAudio!==audio)currentAudio.pause();
if(audio.paused){audio.play();}else{audio.pause();}
};
audio.onplay=()=>{btn.textContent="⏸";div.classList.add('playing');if(currentAudio&&currentAudio!==audio&&currentAudio)currentAudio.pause();currentAudio=audio;};
audio.onpause=()=>{btn.textContent="▶";div.classList.remove('playing');};
audio.onended=()=>{btn.textContent="▶";div.classList.remove('playing');};
});
</script>
</body>
</html>
